services:
  - type: web
    name: healthnexus-backend
    env: python
    runtime: python-3.11.9
    plan: free
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOW_ORIGINS
        value: https://healthnexus-frontend.onrender.com
    autoDeploy: true
    healthCheckPath: /

  - type: static
    name: healthnexus-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://healthnexus-backend.onrender.com
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
