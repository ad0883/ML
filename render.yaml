services:
  - type: web
    name: healthnexus-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOW_ORIGINS
        value: https://healthnexus-frontend.onrender.com

  - type: static
    name: healthnexus-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://healthnexus-backend.onrender.com
